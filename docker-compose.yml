name: ecotracker

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecotracker-db-${ENVIRONMENT:-local}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?defina MSSQL_SA_PASSWORD no .env}
      MSSQL_PID: Developer
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - ecotracker-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      target: final
    image: ${API_IMAGE:-ecotracker-api:local}
    container_name: ecotracker-api-${ENVIRONMENT:-local}
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=${DB_NAME:-EcoTracker};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      Jwt__Key: ${JWT_KEY:?defina JWT_KEY no .env}
      Jwt__Issuer: ${JWT_ISSUER:-EcoTracker}
      Jwt__Audience: ${JWT_AUDIENCE:-EcoTrackerUsers}
      EnableSwagger: ${ENABLE_SWAGGER:-true}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - api-logs:/app/logs
    networks:
      - ecotracker-net
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  mssql-data:
  api-logs:

networks:
  ecotracker-net:
    driver: bridge

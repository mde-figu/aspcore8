name: CI/CD EcoTracker

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ecotracker-api

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore EcoTracker.sln
      - run: dotnet build EcoTracker.sln -c Release --no-restore
      - name: Publicar artefato de build
        run: dotnet publish src/EcoTracker/EcoTracker.csproj -c Release -o ./publish /p:UseAppHost=false
      - uses: actions/upload-artifact@v4
        with:
          name: ecotracker-publish
          path: ./publish

  test:
    name: Testes automatizados
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore EcoTracker.sln
      - name: dotnet test
        run: dotnet test EcoTracker.sln -c Release --no-restore --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./TestResults

  bdd-tests:
    name: Testes BDD e de contrato (API em memória)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Executar cenários Gherkin (Reqnroll)
        run: ./scripts/run-bdd-tests.sh
      - name: Publicar resumo dos testes
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          for trx in glob.glob("tests/EcoTracker.BddTests/TestResults/*.trx"):
              c = ET.parse(trx).find(".//t:Counters", ns).attrib
              print(f"### Testes BDD (em memória)\n\n| Total | Aprovados | Falhas |\n|---|---|---|\n| {c['total']} | {c['passed']} | {c['failed']} |")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bdd-test-report-inmemory
          path: tests/EcoTracker.BddTests/TestResults

  bdd-tests-docker:
    name: Testes BDD contra a stack Docker (API + SQL Server)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Subir stack e executar testes BDD
        run: ./scripts/run-bdd-tests-docker.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bdd-test-report-docker
          path: TestResults

  docker:
    name: Build e push da imagem
    needs: [test, bdd-tests, bdd-tests-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Definir tag da imagem
        id: meta
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy em staging
    needs: docker
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: http://localhost:8080/swagger
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-compose
        with:
          environment: staging
          compose-override: docker-compose.staging.yml
          api-image: ${{ needs.docker.outputs.image }}:${{ github.sha }}
          api-port: "8080"
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          sa-password: ${{ secrets.MSSQL_SA_PASSWORD || 'Ecotracker@2026' }}
          jwt-key: ${{ secrets.JWT_KEY || 'EcoTracker-SecretKey-2026-ESG-Compliance-Min32Chars!' }}

  deploy-production:
    name: Deploy em produção
    needs: [docker, deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://localhost:9090/health
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-compose
        with:
          environment: prod
          compose-override: docker-compose.prod.yml
          api-image: ${{ needs.docker.outputs.image }}:${{ github.sha }}
          api-port: "9090"
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          sa-password: ${{ secrets.MSSQL_SA_PASSWORD || 'Ecotracker@2026' }}
          jwt-key: ${{ secrets.JWT_KEY || 'EcoTracker-SecretKey-2026-ESG-Compliance-Min32Chars!' }}
